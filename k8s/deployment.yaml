apiVersion: apps/v1
kind: Deployment
metadata:
  name: dp-cloudml
  labels:
    app: dp-cloudml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dp-cloudml
  template:
    metadata:
      labels:
        app: dp-cloudml
    spec:
      containers:
        - name: dp-cloudml
          image: dp-cloudml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
